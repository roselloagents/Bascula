services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
      - bascula-interna
    depends_on:
      - bascula-api

  # Solo alcanzable desde `web` por la red interna: sin dokploy-network y sin puertos publicados.
  bascula-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    networks:
      - bascula-interna
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BASCULA_MODELO: ${BASCULA_MODELO:-claude-sonnet-5}
      BASCULA_TOPE_EUROS_DIA: ${BASCULA_TOPE_EUROS_DIA:-4}
      BASCULA_TOPE_GLOBAL_DIA: ${BASCULA_TOPE_GLOBAL_DIA:-400}
      BASCULA_TOPE_IP_DIA: ${BASCULA_TOPE_IP_DIA:-40}
      BASCULA_ORIGENES: ${BASCULA_ORIGENES:-https://bascula.rsagents.es}
      BASCULA_SECRETO: ${BASCULA_SECRETO:-}
    volumes:
      - bascula-datos:/data

networks:
  dokploy-network:
    external: true
  bascula-interna: {}

volumes:
  bascula-datos: {}
