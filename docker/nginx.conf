# Estas zonas van al principio del fichero, FUERA de `server`: conf.d se incluye dentro de `http`
# (SPEC-dieta-propia §1.2). `bascula_caro` protege la interpretación, que cuesta dinero.
limit_req_zone $binary_remote_addr zone=bascula_api:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=bascula_caro:10m rate=6r/m;
# Sin esto nginx responde 503 al limitar (su valor por defecto), y el 503 cae en @api_caida: el
# front lo leería como "función no disponible" en vez de "espera un minuto" (SPEC §1.2 y §5.2).
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # IP real detrás de Traefik (Dokploy): sin esto $remote_addr es siempre la IP del contenedor de
    # Traefik y los límites por IP se convierten en un límite global para todo el mundo.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Assets con hash: cache larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tipografías autoalojadas: el nombre del fichero es estable (no lleva hash),
    # así que caché de un mes y sin "immutable".
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # El servicio de la v1.3: salud y capacidades son baratas; el resto de /api/ no.
    location = /api/salud       { include /etc/nginx/bascula-api.inc; limit_req zone=bascula_api burst=10 nodelay; }
    location = /api/capacidades { include /etc/nginx/bascula-api.inc; limit_req zone=bascula_api burst=10 nodelay; }
    location /api/              { include /etc/nginx/bascula-api.inc; limit_req zone=bascula_caro burst=3 nodelay; }

    # Los errores que pone nginx (límite, cuerpo grande, servicio caído) también salen en JSON.
    # `proxy_intercept_errors` NO se activa: los errores del servicio ya vienen en JSON.
    error_page 405 408 413 429 = @api_limite;
    error_page 502 503 504     = @api_caida;
    location @api_limite {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"codigo":"LIMITE","mensaje":"Demasiadas peticiones o cuerpo demasiado grande."}}';
    }
    location @api_caida {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servicio no responde."}}';
    }

    # SPA: cualquier ruta cae en index.html (sin cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
