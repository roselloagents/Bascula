server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Assets con hash: cache larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tipografías autoalojadas: el nombre del fichero es estable (no lleva hash),
    # así que caché de un mes y sin "immutable".
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA: cualquier ruta cae en index.html (sin cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
